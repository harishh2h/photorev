services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-photorev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-photorev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-photorev}
      HOST: 0.0.0.0
      PORT: 3000
      STORAGE_ROOT: /app/storage
      JWT_SECRET: ${JWT_SECRET:-photorev-docker-dev-secret-change-me-32}
      AUTH_PUBLIC_REGISTRATION: ${AUTH_PUBLIC_REGISTRATION:-false}
      NODE_ENV: ${NODE_ENV:-development}
      ELASTIC_APM_ACTIVE: ${ELASTIC_APM_ACTIVE:-false}
      ELASTIC_APM_SERVICE_NAME: ${ELASTIC_APM_SERVICE_NAME:-photorev-api}
      ELASTIC_APM_SERVER_URL: ${ELASTIC_APM_SERVER_URL:-}
      ELASTIC_APM_SECRET_TOKEN: ${ELASTIC_APM_SECRET_TOKEN:-}
      ELASTIC_APM_API_KEY: ${ELASTIC_APM_API_KEY:-}
      ELASTIC_APM_ENVIRONMENT: ${ELASTIC_APM_ENVIRONMENT:-development}
    volumes:
      - ${STORAGE_PATH:-/data/photorev}:/app/storage
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Optional — leave unset for local/Docker (auto-derives from window.location.hostname:3000).
      # Set to your public API URL when deploying behind Cloudflare or a custom domain:
      #   API_URL=https://api.yourdomain.com
      API_URL: ${API_URL:-}
      # From packages/backend/.env — pass with: docker compose --env-file packages/backend/.env up
      # Comma-separated domains, e.g. photorev.yourserver.in. Omit to allow all hosts.
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    ports:
      - "${WEB_PORT:-5173}:5173"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
    name: photorev_postgres_data
